name: Deploy OpenEMR to EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  DEPLOY_PATH: /var/www/html

jobs:
  deploy:
    name: Deploy to EC2 Ubuntu 24.04
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "#!/bin/bash",
              "set -e",
              "set -o pipefail",
              "exec 2>&1",
              "echo \"=== Starting deployment ===\"",
              "echo \"Timestamp: $(date)\"",
              "export HOME=/home/ubuntu",
              "echo \"=== Stopping Apache ===\"",
              "sudo systemctl stop apache2 || echo \"Apache already stopped\"",
              "echo \"=== Taking ownership for deployment ===\"",
              "sudo chown -R ubuntu:ubuntu ${{ env.DEPLOY_PATH }}",
              "cd ${{ env.DEPLOY_PATH }} || { echo \"Failed to change to deploy directory\"; exit 1; }",
              "echo \"=== Backing up OpenEMR configuration files ===\"",
              "mkdir -p /tmp/openemr-backup",
              "if [ -f sites/default/sqlconf.php ]; then cp sites/default/sqlconf.php /tmp/openemr-backup/; fi",
              "if [ -d sites/default/documents ]; then cp -r sites/default/documents /tmp/openemr-backup/; fi",
              "if [ -d sites/default/letter_templates ]; then cp -r sites/default/letter_templates /tmp/openemr-backup/; fi",
              "if [ -f gacl/admin.data ]; then cp gacl/admin.data /tmp/openemr-backup/; fi",
              "if [ -f sites/default/config.php ]; then cp sites/default/config.php /tmp/openemr-backup/; fi",
              "echo \"=== Configuring Git safe directory ===\"",
              "git config --global --add safe.directory ${{ env.DEPLOY_PATH }}",
              "echo \"=== Resetting local changes ===\"",
              "git reset --hard HEAD || { echo \"Git reset failed\"; exit 1; }",
              "git clean -fd || echo \"Git clean completed\"",
              "echo \"=== Fetching latest changes ===\"",
              "git fetch origin || { echo \"Git fetch failed\"; exit 1; }",
              "echo \"=== Checking out production branch ===\"",
              "git checkout production || { echo \"Git checkout failed\"; exit 1; }",
              "echo \"=== Pulling latest changes with force ===\"",
              "git reset --hard origin/production || { echo \"Git reset to origin failed\"; exit 1; }",
              "echo \"=== Restoring OpenEMR configuration files ===\"",
              "if [ -f /tmp/openemr-backup/sqlconf.php ]; then cp /tmp/openemr-backup/sqlconf.php sites/default/; fi",
              "if [ -d /tmp/openemr-backup/documents ]; then cp -r /tmp/openemr-backup/documents sites/default/; fi",
              "if [ -d /tmp/openemr-backup/letter_templates ]; then cp -r /tmp/openemr-backup/letter_templates sites/default/; fi",
              "if [ -f /tmp/openemr-backup/admin.data ]; then cp /tmp/openemr-backup/admin.data gacl/; fi",
              "if [ -f /tmp/openemr-backup/config.php ]; then cp /tmp/openemr-backup/config.php sites/default/; fi",
              "rm -rf /tmp/openemr-backup",
              "echo \"=== Installing Composer dependencies ===\"",
              "export COMPOSER_ALLOW_SUPERUSER=1 && composer install --no-dev --optimize-autoloader 2>&1 || { echo \"Composer install failed\"; exit 1; }",
              "echo \"=== Generating autoload files ===\"",
              "export COMPOSER_ALLOW_SUPERUSER=1 && composer dump-autoload -o 2>&1 || { echo \"Composer dump-autoload failed\"; exit 1; }",
              "echo \"=== Installing NPM dependencies ===\"",
              "npm install 2>&1 || { echo \"NPM install failed\"; exit 1; }",
              "echo \"=== Building frontend assets ===\"",
              "npm run build 2>&1 || { echo \"NPM build failed\"; exit 1; }",
              "echo \"=== Restoring ownership to www-data ===\"",
              "sudo chown -R www-data:www-data ${{ env.DEPLOY_PATH }}",
              "sudo chmod -R 755 ${{ env.DEPLOY_PATH }}",
              "echo \"=== Starting Apache ===\"",
              "sudo systemctl start apache2 || { echo \"Apache start failed\"; exit 1; }",
              "sudo systemctl status apache2 --no-pager || true",
              "echo \"=== Deployment completed successfully! ===\"",
              "echo \"Timestamp: $(date)\""
            ],executionTimeout=["7200"]' \
            --timeout-seconds 600 \
            --region "${{ env.AWS_REGION }}" \
            --query 'Command.CommandId' \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          
          # Custom polling loop for long-running command
          MAX_ATTEMPTS=144  # 2 hours (144 * 50 seconds)
          ATTEMPT=0
          
          echo "Monitoring deployment progress..."
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws ssm list-commands \
              --command-id "$COMMAND_ID" \
              --region "${{ env.AWS_REGION }}" \
              --query "Commands[0].Status" \
              --output text)
            
            echo "Status: $STATUS (Check $ATTEMPT/$MAX_ATTEMPTS)"
            
            if [[ "$STATUS" == "Success" ]]; then
              echo "✅ Deployment completed successfully!"
              exit 0
            elif [[ "$STATUS" == "Failed" ]] || [[ "$STATUS" == "TimedOut" ]] || [[ "$STATUS" == "Cancelled" ]]; then
              echo "❌ Deployment failed with status: $STATUS"
              exit 1
            elif [[ "$STATUS" == "Pending" ]] || [[ "$STATUS" == "InProgress" ]]; then
              sleep 50
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "⚠️  Unknown status: $STATUS"
              sleep 30
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done
          
          echo "❌ Polling timeout reached after 2 hours"
          exit 1

      - name: Get deployment output
        if: always()
        run: |
          echo "=== Deployment Output ==="
          aws ssm get-command-invocation \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'StandardOutputContent' \
            --output text || echo "Could not retrieve output"

      - name: Check for deployment errors
        if: always()
        run: |
          echo "=== Deployment Errors ==="
          aws ssm get-command-invocation \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'StandardErrorContent' \
            --output text || echo "No errors"

      - name: Connect via SSM (manual step info)
        if: failure()
        run: |
          echo "❌ Deployment failed. To troubleshoot via SSM, run:"
          echo "aws ssm start-session --target ${{ env.EC2_INSTANCE_ID }} --region ${{ env.AWS_REGION }}"
